# MiniMessage format. <prefix> is replaced with the prefix below.
prefix: "<gradient:#f7b733:#fc4a1a><b>Crates</b></gradient> <dark_gray>»</dark_gray> "

no-permission: "<prefix><red>You don't have permission to do that."
no-key: "<prefix><red>You need a <crate> <red>key to open this crate."
crate-busy: "<prefix><yellow>Someone is opening this crate, please wait a moment."
already-opening: "<prefix><yellow>You are already opening a crate."
inventory-full: "<prefix><red>Free up an inventory slot before opening a crate."
reward-received: "<prefix><gray>You won <reward><gray>!"
reward-broadcast: "<prefix><white><player></white> <gray>won <reward> <gray>from <crate><gray>!"
key-received: "<prefix><gray>You received <white><amount>x</white> <crate> <gray>key(s)."
keyall-broadcast: "<prefix><gray>Everyone online received <white><amount>x</white> <crate> <gray>key(s)!"

admin:
  keys-given: "<prefix><gray>Gave <white><amount>x</white> <crate> <gray>key(s) to <white><count></white> player(s)."
  keys-taken: "<prefix><gray>Took <white><amount>x</white> <crate> <gray>key(s) from <white><player></white>."
  keys-view-header: "<prefix><gray>Virtual keys of <white><player></white>:"
  keys-view-line: "<dark_gray> • </dark_gray><crate><dark_gray>: </dark_gray><white><amount>"
  unknown-crate: "<prefix><red>Unknown crate: <white><id>"
  not-looking-at-block: "<prefix><red>Look at a block within 6 blocks."
  crate-set: "<prefix><green>This block is now a <crate> <green>crate."
  crate-removed: "<prefix><green>Removed the <crate> <green>crate from this block."
  not-a-crate: "<prefix><red>That block is not a crate."
  break-hint: "<prefix><gray>Sneak while breaking to remove this crate."
  hold-an-item: "<prefix><red>Hold the item you want to add in your main hand."
  item-added: "<prefix><green>Added your held item to <crate> <green>with weight <white><weight></white>."
  reloaded: "<prefix><green>Reloaded <white><count></white> crate(s)."
  list-header: "<prefix><gray>Loaded crates:"
  list-line: "<dark_gray> • </dark_gray><white><id></white> <dark_gray>—</dark_gray> <crate> <dark_gray>(<rewards> rewards, <animation>)"
  players-only: "<prefix><red>Only players can use this."

menu:
  crates-title: "<dark_gray>Crates"
  crates-keys: "<gray>Your keys: <white><amount>"
  crates-left: "<yellow>Left-click <gray>to open"
  crates-right: "<yellow>Right-click <gray>to preview"
  preview-title: "<dark_gray>Preview » </dark_gray><crate>"
  preview-chance: "<gray>Chance: <white><chance>%"
  previous-page: "<yellow>« Previous page"
  next-page: "<yellow>Next page »"
  close: "<red>Close"
  roulette-title: "<dark_gray>Opening » </dark_gray><crate>"
