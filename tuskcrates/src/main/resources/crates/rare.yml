display-name: "<gradient:#4facfe:#00f2fe><b>Rare</b></gradient>"
animation: roulette
show-in-menu: true

key:
  material: TRIPWIRE_HOOK
  name: "<crate> <white>Key"
  lore:
    - "<gray>Right-click a <crate> <gray>crate"
    - "<gray>to open it."
  glow: true

hologram:
  - "<crate> <white>Crate"
  - "<gray>Right-click with a key"
