        efficiency: 4
        unbreaking: 3
  sword:
    weight: 20
    item:
      material: DIAMOND_SWORD
      name: "<aqua>Duelist's Blade"
      enchantments:
        sharpness: 4
        unbreaking: 3
  mending:
    weight: 15
    item:
      material: ENCHANTED_BOOK
      enchantments:
        mending: 1
  shulker:
    weight: 10
    item:
      material: SHULKER_BOX
  totem:
    weight: 5
    item:
      material: TOTEM_OF_UNDYING
    broadcast: true
