    lore:
      - '<yellow>Click for the full list'
  home:
    name: '<aqua>Clan home'
    lore:
      - '<yellow>Click to teleport'
  home-missing:
    name: '<gray>Clan home'
    lore:
      - '<gray>Not set yet — an officer can use'
      - '<white>/clan sethome'
  chat:
    name: '<dark_aqua>Clan chat'
    lore:
      - '<gray>Switch between clan and public chat'
  allychat:
    name: '<light_purple>Ally chat'
    lore:
      - '<gray>Switch between ally and public chat'
  top:
    name: '<gold>Top clans'
    lore:
      - '<gray>See the leaderboard'
  help:
    name: '<white>Commands'
    lore:
      - '<gray>List every /clan command'
  ff:
    name: '<red>Friendly fire: <white><ff>'
    lore:
      - '<yellow>Click to toggle'
  open:
    name: '<green>Open to join: <white><open>'
    lore:
      - '<yellow>Click to toggle'
  leave:
    name: '<red>Leave clan'
    lore:
      - '<gray>Leave <white><tag></white>'
