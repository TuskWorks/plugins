      name: "<green>建立收購單"
      lore:
        - "<gray>掛出收購單，讓其他玩家"
        - "<gray>把物品送來給你。"
        - ""
        - "<yellow>點擊開始"

  deliver:
    title: "交貨 <item>（剩 <remaining> 個，每個 <price>）"

  mine:
    title: "我的收購單"
    empty: "<gray>你還沒有收購單"
    back: "<white>返回收購市場"
    collect-all: "<green>全部領取"
    order:
      lore:
        - "<gray>收購單 #<id> · <status>"
        - "<gray>單價：<green><price>"
        - ""
        - "<bar> <white><delivered></white><gray>/<amount>"
        - "<gray>待領取：<white><uncollected>"
        - "<gray>保管中金額：<green><escrow>"
        - "<gray>剩餘時間：<white><expires>"
        - ""
      collect:
        - "<yellow>點擊領取物品"
      cancel:
        - "<red>Shift + 右鍵取消收購單"

  cancel:
    title: "確定取消這張收購單？"
    summary:
      name: "<white>取消收購單 #<id>"
      lore:
        - "<gray>退回金額：<green><refund>"
        - "<gray>已交付的物品仍可領取。"

  create:
    title: "確定建立這張收購單？"
