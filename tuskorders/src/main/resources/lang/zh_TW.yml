    price: "單價最高"
    recent: "最新上架"
    payout: "總額最高"
  status:
    active: "<green>進行中"
    completed: "<aqua>已完成"
    cancelled: "<red>已取消"
    expired: "<yellow>已到期"
  confirm:
    accept: "<green><bold>確認"
    deny: "<red><bold>取消"

  browse:
    title: "收購市場"
    empty: "<gray>目前沒有收購單"
    no-results: "<gray>找不到「<white><filter></white>」的收購單"
    order:
      lore:
        - "<gray>買家：<white><owner>"
        - "<gray>單價：<green><price>"
        - ""
        - "<bar> <white><delivered></white><gray>/<amount>"
        - "<gray>可賺金額：<green><payout>"
        - "<gray>剩餘時間：<white><expires>"
        - ""
      deliver:
        - "<yellow>點擊交貨"
      own:
        - "<gray>這是你的收購單"
    sort:
      name: "<white>排序"
      selected: ["<green>▶ <sort>"]
      option: ["<gray>  <sort>"]
      hint: ["", "<yellow>點擊切換"]
    search:
      name: "<white>搜尋"
      lore:
        - "<gray>搜尋某個物品的收購單"
        - ""
        - "<yellow>點擊搜尋"
      lore-active:
        - "<gray>目前顯示：<white><filter>"
        - ""
        - "<yellow>點擊重新搜尋"
        - "<yellow>右鍵清除搜尋"
    mine:
      name: "<white>我的收購單"
      lore:
        - "<gray>進行中：<white><active>"
        - "<gray>待領取物品：<white><uncollected>"
        - ""
        - "<yellow>點擊查看"
