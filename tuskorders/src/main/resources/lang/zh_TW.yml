      name: "<white><amount> 個 <item>"
      lore:
        - "<gray>單價：<green><price>"
        - "<gray>現在支付：<green><total>"
        - "<gray>有效期限：<white><expires>"
        - ""
        - "<gray>取消或到期時，"
        - "<gray>未成交的部分會退款。"
      lore-fee:
        - "<gray>單價：<green><price>"
        - "<gray>現在支付：<green><total>"
        - "<gray>含手續費：<red><fee></red> <dark_gray>（不退還）"
        - "<gray>有效期限：<white><expires>"
        - ""
        - "<gray>取消或到期時，"
        - "<gray>未成交的部分會退款。"
