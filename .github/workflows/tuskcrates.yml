name: TuskCrates

on:
  push:
    paths:
      - "tuskcrates/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/tuskcrates.yml"
  pull_request:
    paths:
      - "tuskcrates/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/tuskcrates.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and unit test
        run: ./gradlew :tuskcrates:build
      - uses: actions/upload-artifact@v7
        with:
          name: TuskCrates
          path: tuskcrates/build/libs/TuskCrates-*.jar
          if-no-files-found: error

  # The jar targets the 1.21.4 API; make sure the sources still compile against the newest API.
  api-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile against Paper API 26.2
        run: ./gradlew :tuskcrates:compileJava -PpaperApi=26.2.build.128-stable

  e2e:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "1.21.4", flags: "" }
          - { mc: "1.21.11", flags: "" }
          - { mc: "26.1.2", flags: "" }
          - { mc: "1.21.11", flags: "--folia" }
          - { mc: "26.1.2", flags: "--folia" }
          - { mc: "26.3", flags: "" }
    name: e2e ${{ matrix.mc }} ${{ matrix.flags }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tuskcrates/e2e/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: TuskCrates
          path: tuskcrates/build/libs
      - name: Install mineflayer
        working-directory: tuskcrates/e2e
        run: npm ci
      - name: Run end-to-end tests
        working-directory: tuskcrates/e2e
        env:
          E2E_JAVA_21: ${{ env.JAVA_HOME_21_X64 }}
          E2E_JAVA_25: ${{ env.JAVA_HOME_25_X64 }}
        run: node run.js --mc ${{ matrix.mc }} ${{ matrix.flags }}
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-log-${{ matrix.mc }}${{ matrix.flags }}
          path: tuskcrates/e2e/.work/*/logs/latest.log
