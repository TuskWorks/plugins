name: TuskCrates

on:
  push:
    branches: [main]
    paths:
      - 'tuskcrates/**'
      - 'e2e/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/tuskcrates.yml'
  pull_request:
    paths:
      - 'tuskcrates/**'
      - 'e2e/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/tuskcrates.yml'
  workflow_dispatch:
  # release.yml runs the full suite before publishing a tagged version
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and unit test
        run: ./gradlew :tuskcrates:build
      - uses: actions/upload-artifact@v7
        with:
          name: TuskCrates
          path: tuskcrates/build/libs/TuskCrates-*.jar
          if-no-files-found: error

  # The jar targets the 1.21.4 API; make sure the sources still compile against the newest API.
  api-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile against Paper API 26.2
        run: ./gradlew :tuskcrates:compileJava -PpaperApi=26.2.build.128-stable

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: e2e ${{ matrix.scenario }} (${{ matrix.server }} ${{ matrix.mc }})
    strategy:
      fail-fast: false
      matrix:
        # Bots up to 26.1.2 (the newest protocol mineflayer speaks); console smoke test on 26.3.
        include:
          - { scenario: tuskcrates, server: paper, mc: '1.21.4' }
          - { scenario: tuskcrates, server: paper, mc: '1.21.11' }
          - { scenario: tuskcrates, server: paper, mc: '26.1.2' }
          - { scenario: tuskcrates, server: paper, mc: '26.3' }
          - { scenario: tuskcrates, server: folia, mc: '1.21.11' }
          - { scenario: tuskcrates, server: folia, mc: '26.1.2' }
          - { scenario: tuskcrates-extra, server: paper, mc: '26.1.2' }
          - { scenario: tuskcrates-extra, server: folia, mc: '1.21.11' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: TuskCrates
          path: tuskcrates/build/libs
      - run: npm ci
        working-directory: e2e
      - run: node run.js --scenario ${{ matrix.scenario }} --server ${{ matrix.server }} --mc ${{ matrix.mc }}
        working-directory: e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-logs-${{ matrix.scenario }}-${{ matrix.server }}-${{ matrix.mc }}
          path: e2e/.run/*/logs/latest.log
          # .run is a dot directory, which upload-artifact skips by default
          include-hidden-files: true
