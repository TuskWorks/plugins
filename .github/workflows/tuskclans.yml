name: TuskClans

on:
  push:
    branches: [main]
    paths:
      - 'tuskclans/**'
      - 'e2e/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/tuskclans.yml'
  pull_request:
    paths:
      - 'tuskclans/**'
      - 'e2e/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/tuskclans.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # The test economy stands in for Vault in the creation cost step of tuskclans-extra
      - run: ./gradlew :tuskclans:build :e2e-test-economy:build
      - uses: actions/upload-artifact@v7
        with:
          name: TuskClans
          path: tuskclans/build/libs/*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: TestEconomy
          path: e2e/fixtures/test-economy/build/libs/*.jar
          if-no-files-found: error

  # The jar targets the 1.21.4 API; make sure the sources still compile against the newest API.
  api-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile against Paper API 26.2
        run: ./gradlew :tuskclans:compileJava -PpaperApi=26.2.build.128-stable

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: e2e ${{ matrix.scenario }} (${{ matrix.server }} ${{ matrix.mc }})
    strategy:
      fail-fast: false
      matrix:
        # Bots up to 26.1.2 (the newest protocol mineflayer speaks); console smoke test on 26.3.
        include:
          - { scenario: tuskclans, server: paper, mc: '1.21.4' }
          - { scenario: tuskclans, server: paper, mc: '1.21.11' }
          - { scenario: tuskclans, server: paper, mc: '26.1.2' }
          - { scenario: tuskclans, server: paper, mc: '26.3' }
          - { scenario: tuskclans, server: folia, mc: '1.21.11' }
          - { scenario: tuskclans, server: folia, mc: '26.1.2' }
          - { scenario: tuskclans-extra, server: paper, mc: '26.1.2' }
          - { scenario: tuskclans-extra, server: folia, mc: '1.21.11' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: TuskClans
          path: tuskclans/build/libs
      - uses: actions/download-artifact@v8
        with:
          name: TestEconomy
          path: e2e/fixtures/test-economy/build/libs
      - run: npm ci
        working-directory: e2e
      - run: node run.js --scenario ${{ matrix.scenario }} --server ${{ matrix.server }} --mc ${{ matrix.mc }}
        working-directory: e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-logs-${{ matrix.scenario }}-${{ matrix.server }}-${{ matrix.mc }}
          path: e2e/.run/*/logs/latest.log
