name: TuskClans

on:
  push:
    branches: [main]
    paths:
      - 'tuskclans/**'
      - 'e2e/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/tuskclans.yml'
  pull_request:
    paths:
      - 'tuskclans/**'
      - 'e2e/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/tuskclans.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :tuskclans:build
      - uses: actions/upload-artifact@v7
        with:
          name: TuskClans
          path: tuskclans/build/libs/*.jar
          if-no-files-found: error

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: e2e (${{ matrix.server }} ${{ matrix.mc }})
    strategy:
      fail-fast: false
      matrix:
        # Bots on 1.21.11 and 26.1.2 (the newest protocol mineflayer speaks); console smoke test on 26.3.
        include:
          - { server: paper, mc: '1.21.11' }
          - { server: paper, mc: '26.1.2' }
          - { server: paper, mc: '26.3' }
          - { server: folia, mc: '1.21.11' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: TuskClans
          path: tuskclans/build/libs
      - run: npm ci
        working-directory: e2e
      - run: node run.js --server ${{ matrix.server }} --mc ${{ matrix.mc }}
        working-directory: e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-logs-${{ matrix.server }}-${{ matrix.mc }}
          path: e2e/.run/*/logs/latest.log
